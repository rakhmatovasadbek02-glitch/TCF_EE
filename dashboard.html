<!DOCTYPE html>
<html>
<body>
  <h1>Teacher Dashboard</h1>
  <div id="list"></div>

  <script>
    async function loadData() {
      const res = await fetch("http://localhost:3000/writings");
      const data = await res.json();

      const list = document.getElementById("list");

      data.forEach(item => {
        const div = document.createElement("div");
        div.innerHTML = `
          <h3>${item.student}</h3>
          <p>${item.content}</p>
          <hr>
        `;
        list.appendChild(div);
      });
    }

    loadData();
  </script>
</body>
</html>
