<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c1: #42587D;
      --c2: #4D6691;
      --c3: #5673A7;
      --c4: #708CC5;
      --c5: #9FADCB;
      --line: rgba(255,255,255,0.12);
      --line-hi: rgba(255,255,255,0.25);
      --text: #ffffff;
      --text-muted: rgba(255,255,255,0.75);
      --green: #a8d5b5;
      --red: #f4a0a0;
      --font: 'DM Sans', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--c1);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* TOPBAR */
    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: var(--c1);
      border-bottom: 1px solid var(--line);
    }

    .topbar-left { display: flex; align-items: center; gap: 12px; }

    .brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .brand-sep { width: 1px; height: 14px; background: var(--line-hi); }

    .brand-sub {
      font-size: 12px;
      font-weight: 300;
      color: var(--text-muted);
    }

    /* CONTENT */
    .content {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* STATES */
    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 300;
    }

    .error-box {
      background: rgba(244,160,160,0.15);
      border: 1px solid rgba(244,160,160,0.3);
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      color: var(--red);
    }

    .error-box p { font-size: 14px; margin-bottom: 8px; }
    .error-box .hint { font-size: 12px; color: var(--text-muted); }

    .retry-btn {
      margin-top: 16px;
      padding: 8px 20px;
      background: #ffffff;
      color: var(--c1);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
    }

    .empty {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 300;
      font-style: italic;
    }

    /* CARD */
    .card {
      background: var(--c2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 14px;
    }

    .card-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .student-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .card-date {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 300;
    }

    .task-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 12px;
      margin-bottom: 4px;
    }

    .task-text {
      font-size: 14px;
      font-weight: 300;
      line-height: 1.7;
      color: var(--text);
    }

    .no-answer {
      font-style: italic;
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="brand">TCF</span>
    <span class="brand-sep"></span>
    <span class="brand-sub">Teacher Dashboard</span>
  </div>
  <a href="/index.html" style="color:var(--text-muted);font-size:12px;text-decoration:none;">← Exam</a>
</div>

<div class="content">
  <div id="list"></div>
</div>

<script>
  async function loadData() {
    const list = document.getElementById("list");
    list.innerHTML = "<div class='loading'>Loading submissions…</div>";

    try {
      const res = await fetch("/writings");
      if (!res.ok) throw new Error("Server returned " + res.status);

      const data = await res.json();
      list.innerHTML = "";

      if (data.length === 0) {
        list.innerHTML = "<div class='empty'>No submissions yet.</div>";
        return;
      }

      data.forEach(item => {
        const c = (item.content && typeof item.content === "object") ? item.content : {};
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-header">
            <span class="student-name">${item.student}</span>
            <span class="card-date">${new Date(item.date).toLocaleString()}</span>
          </div>
          ${["task1","task2","task3"].map((key, i) => `
            <div class="task-label">Tâche ${i + 1}</div>
            <div class="task-text">${c[key] ? c[key] : '<span class="no-answer">No answer</span>'}</div>
          `).join("")}
        `;
        list.appendChild(card);
      });

    } catch (err) {
      list.innerHTML = `
        <div class="error-box">
          <p>⚠ Could not connect to the server.</p>
          <p class="hint">Make sure the server is running.</p>
          <button class="retry-btn" onclick="loadData()">Retry</button>
        </div>
      `;
    }
  }

  loadData();
  setInterval(loadData, 30000);
</script>
</body>
</html>
