<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Writing Timer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="light">

  <div class="container">

    <!-- 🏷 Title -->
    <div class="topbar">
        <button id="fullscreenBtn">⛶</button>

  <div class="logo">

    TCF Simulator

  </div>

    <!-- ⏱ Timer -->
      <div class="timer" id="timer">

    60:00

  </div>

  <!-- 🌙 Dark Mode -->
  <div class="theme-icons">

    <span id="lightMode">☀️</span>

    <span id="darkMode">🌙</span>

  </div>

</div>

    <!-- ▶️ Controls -->
    <div class="controls">
      <button onclick="startTimer()">Start</button>
      <button onclick="saveWriting()">Submit</button>
    </div>

  <div class="task-buttons">
  <button onclick="selectTask(1)" class="active">Tâche 1</button>
  <button onclick="selectTask(2)">Tâche 2</button>
  <button onclick="selectTask(3)">Tâche 3</button>
</div>

    <!-- 📝 TASKS -->
<div class="tasks">

  <!-- Task 1 -->
  <div class="task" id="taskBox1">
    <textarea id="task1" placeholder="Start writing..." disabled></textarea>
    <p id="count1">0 words</p>
  </div>

  <!-- Task 2 -->
  <div class="task" id="taskBox2" style="display:none;">
    <textarea id="task2" placeholder="Start writing..." disabled></textarea>
    <p id="count2">0 words</p>
  </div>

  <!-- Task 3 -->
  <div class="task" id="taskBox3" style="display:none;">
    <textarea id="task3" placeholder="Start writing..." disabled></textarea>
    <p id="count3">0 words</p>
  </div>

  </div>

  <!-- ⚙️ JS -->
  <script src="script.js"></script>

</body>
</html>
