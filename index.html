<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TCF — Expression Écrite</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="brand">TCF</span>
      <span class="brand-sep"></span>
      <span class="brand-sub">Expression Écrite</span>
    </div>
    <div class="topbar-center">
      <span id="timer" class="timer">60:00</span>
      <div class="timer-label">TEMPS RESTANT</div>
    </div>
    <div class="topbar-right">
      <button class="btn-start" onclick="startTimer()">Commencer</button>
      <button class="btn-submit" onclick="saveWriting()">Soumettre</button>
    </div>
  </div>

  <!-- SELECTOR BAR — always visible -->
  <div class="selectorbar">
    <label class="selector-label" for="setSelect">SUJET</label>
    <select id="setSelect" class="set-select"></select>
    <span id="setStatus" class="set-status"></span>
  </div>

  <!-- ACTION BAR -->
  <div class="actionbar">
    <nav class="task-nav">
      <button class="task-btn active" onclick="selectTask(1)">Tâche 01</button>
      <button class="task-btn" onclick="selectTask(2)">Tâche 02</button>
      <button class="task-btn" onclick="selectTask(3)">Tâche 03</button>
    </nav>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- CONSIGNE -->
    <div class="consigne-panel">
      <div class="consigne-label">CONSIGNE</div>
      <p id="questionText" class="consigne-text">Sélectionnez un sujet pour commencer.</p>
    </div>

    <!-- WRITING -->
    <div class="write-panel">
      <div class="task-area" id="taskBox1">
        <textarea id="task1" placeholder="Rédigez votre réponse…" disabled></textarea>
        <div class="write-footer"><span id="count1" class="wc">0 mot</span></div>
      </div>
      <div class="task-area" id="taskBox2" style="display:none">
        <textarea id="task2" placeholder="Rédigez votre réponse…" disabled></textarea>
        <div class="write-footer"><span id="count2" class="wc">0 mot</span></div>
      </div>
      <div class="task-area" id="taskBox3" style="display:none">
        <textarea id="task3" placeholder="Rédigez votre réponse…" disabled></textarea>
        <div class="write-footer"><span id="count3" class="wc">0 mot</span></div>
      </div>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
