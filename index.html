<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Writing Timer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="light">

  <div class="container">

    <!-- 🌙 Dark Mode -->
    <button id="themeToggle">🌙 Dark Mode</button>

    <!-- 🏷 Title -->
    <h1>✍️ Writing Session</h1>

    <!-- ⏱ Timer -->
    <div id="timer">60:00</div>

    <!-- ▶️ Controls -->
    <div class="controls">
      <button onclick="startTimer()">Start</button>
      <button onclick="saveWriting()">Submit</button>
    </div>

    <div class="task-buttons">
  <button onclick="selectTask(1)">Tâche 1</button>
  <button onclick="selectTask(2)">Tâche 2</button>
  <button onclick="selectTask(3)">Tâche 3</button>
   </div>

    <!-- 📝 TASKS -->
  <div class="task" id="taskBox1">
  <h2>Tâche 1</h2>
  <textarea id="task1" disabled></textarea>
  <p id="count1">0 words</p>
</div>

<div class="task" id="taskBox2" style="display:none;">
  <h2>Tâche 2</h2>
  <textarea id="task2" disabled></textarea>
  <p id="count2">0 words</p>
</div>

<div class="task" id="taskBox3" style="display:none;">
  <h2>Tâche 3</h2>
  <textarea id="task3" disabled></textarea>
  <p id="count3">0 words</p>
</div>
 </div>

  </div>

  <!-- ⚙️ JS -->
  <script src="script.js"></script>

</body>
</html>
