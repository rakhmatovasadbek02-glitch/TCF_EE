<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <button id="themeToggle">🌙 Dark Mode</button>
  <title>Writing Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<body class="light"></body>
  <div class="container">
    <h1>✍️ Writing Session</h1>

    <div id="timer">10:00</div>

    <div class="controls">
      <button onclick="startTimer()">Start</button>
      <button onclick="saveWriting()">Submit</button>
    </div>

    <textarea id="writingArea" placeholder="Start writing your thoughts..." disabled></textarea>
  </div>

  <script src="script.js"></script>
</body>
</html>

<p id="wordCount">0 words</p>
