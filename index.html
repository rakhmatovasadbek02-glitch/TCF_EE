<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title id="pageTitle">TCF — Expression Écrite</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .lang-toggle { display:flex; gap:4px; }
  </style>
</head>
<body>

<div class="shell">

  <div class="topbar">
    <div class="topbar-left">
      <span class="brand">TCF</span>
      <span class="brand-sep"></span>
      <span class="brand-sub" id="t_brand_sub"></span>
    </div>
    <div class="topbar-center">
      <span id="timer" class="timer">60:00</span>
      <div class="timer-label" id="t_timer_label"></div>
    </div>
    <div class="topbar-right" style="display:flex;align-items:center;gap:10px;">
      <div class="lang-toggle" id="langToggle"></div>
      <button class="btn-start" onclick="startTimer()" id="t_btn_start"></button>
      <button class="btn-submit" onclick="saveWriting()" id="t_btn_submit"></button>
    </div>
  </div>

  <div class="selectorbar">
    <label class="selector-label" id="t_subject_label" for="setSelect"></label>
    <select id="setSelect" class="set-select"></select>
    <span id="setStatus" class="set-status"></span>
  </div>

  <div class="actionbar">
    <nav class="task-nav">
      <button class="task-btn active" onclick="selectTask(1)" id="t_task1"></button>
      <button class="task-btn" onclick="selectTask(2)" id="t_task2"></button>
      <button class="task-btn" onclick="selectTask(3)" id="t_task3"></button>
    </nav>
  </div>

  <div class="main">
    <div class="consigne-panel">
      <div class="consigne-label" id="t_consigne_label"></div>
      <p id="questionText" class="consigne-text"></p>
    </div>
    <div class="write-panel">
      <div class="task-area" id="taskBox1">
        <textarea id="task1" disabled></textarea>
        <div class="write-footer"><span id="count1" class="wc"></span></div>
      </div>
      <div class="task-area" id="taskBox2" style="display:none">
        <textarea id="task2" disabled></textarea>
        <div class="write-footer"><span id="count2" class="wc"></span></div>
      </div>
      <div class="task-area" id="taskBox3" style="display:none">
        <textarea id="task3" disabled></textarea>
        <div class="write-footer"><span id="count3" class="wc"></span></div>
      </div>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
